addon: "Dora Machines"

item:
  explosion_pickaxe:
    name: "Explosion Pickaxe"
    lore: |-
      <arrow> Destory 5x5x5 or 3x3x3 area's block
      <arrow> Use <yellow>Shift <white>+ <green>Right Click <white>to exchange model
  explosion_shovel:
    name: "Explosion Shovel"
    lore: |-
      <arrow> Destory 5x5x5 or 3x3x3 area's block
      <arrow> Use <yellow>Shift <white>+ <green>Right Click <white>to exchange model
  unbreakable_rune:
    name: "Unbreakable Rune"
    lore: |-
      <arrow> Give item unbreakable
  plan_c:
    name: "Plan C"
    lore: |-
      <arrow> <red>Kill <white>all mobs within a 5-degree radius include yourself
      <arrow> <red>Destory <white>itself after use
  industrial_miner:
    name: "Industrial Miner"
    lore: |-
      <star> Multiblocks
      <arrow> 2x Diamond Block
      <arrow> 2x Facing UP piston
      <arrow> 1x Chest
      <arrow> Consume lava to dig ores
      <arrow> Need to put lava bucket in the chest
      <arrow> Right Click after put lava bucket in the chest
  golden_bone_meal:
    name: "Golden Bone Meal"
    lore: |-
      <arrow> Let's all crop include sugar cane grow fully mature
  filter:
    name: "Filter"
    lore: |-
      <arrow> Used for filter base
  filter_base:
    name: "Filter Base"
    lore: |- 
      <arrow> Require a filter
      <arrow> Require waterlogged
      <arrow> Output dust per tick
  multi_fluid_tank:
    name: "Multifluid Tank"
    lore: |-
      <arrow> Support four type of fluid
      <arrow> Require fluid tank casing
      <arrow> Max capacity depend on the casing you put
  timing_charger:
    name: "Timing Charger"
    lore: |-
      <arrow> Active the second block down which block type is Dropper/Dispenser
      <arrow> Active per specified tick you set
  liselette_enchanter:
    name: "Liselette Enchanter"
    lore: |-
      <arrow> Allow enchant pylon equitment through enchant book
      <arrow> <attr><lang:pylon.fluid.obscyra/> usage:</attr> %fluid-per-craft% per seconds
      <arrow> <attr>Buffer:</attr> %buffer%
  liselette_disenchanter:
    name: "Liselette Disenchanter"
    lore: |-
      <arrow> Allow extract enchantment to enchant book / book
      <arrow> <attr><lang:pylon.fluid.obscyra/> usage:</attr> %fluid-per-craft% per seconds
      <arrow> <attr>Buffer:</attr> %buffer%
  road_tool:
    name: "Road Tool"
    lore: |-
      <arrow> Place blocks when sneaking if the block under you is air
      <arrow> Require have blocks in backpack
      <arrow> Remove blocks after <yellow>%delete_delay%<gray>s
      <arrow> Use <green>Right Click <gray>to switch on/off
      <arrow> Use <yellow>Shift <gray>+ <green>Right Click <gray>to exchange block type
      <arrow> Toggle: <yellow>%enabled%
      <arrow> Block type: <yellow>%block%
  portable_backpack:
    name: "Portable Backpack"
    lore: |-
      <arrow> Store you items or fluids
      <arrow> <green>Right Click <gray>to open
      <arrow> Place on the ground to inject fluid
      <arrow> Use /setbackpackname to change backpack's name
      <arrow> %type1%: %amount1%/%capacity%
      <arrow> %type2%: %amount2%/%capacity%
  redstone_link:
    name: "Redstone Link"
    lore: |-
      <arrow> Remote transmit <red>redstone power
      <arrow> <gray>Max transmit radius: <green>%radius% <gray>blocks
      <arrow> Trigger interval: <green>%ticks% <gray>ticks
      <arrow> Use %have-wrench% to switch mode between transmitter/receiver
      <arrow> Use <insn><lang:doramachines.item.linked_connector.name></insn> to Set Channel
    have_wrench: <insn><lang:rebarwrench.item.wrench.name></insn>
    dont_have_wrench: <insn>Stick</insn>
  linked_connector:
    name: "Linked Connector"
    lore: |-
      <arrow> Set Channel between <insn><lang:doramachines.item.redstone_link.name></insn>'s transmitter and receiver
      <arrow> <green>Right Click <yellow>transmitter <gray>to record channel
      <arrow> Then <green>Right Click <yellow>receiver <gray>to set channel
      <arrow> <yellow>Shift <gray>+ <green>Right Click <gray>to check active transmitter/receiver's location which at same channel
  temp_block:
    name: "test block"
  hydraulic_woodcutter:
    name: "Hydraulic Woodcutter"
    lore: |-
      <arrow> Automatic logging and consume one piece of log in output inventory to replanting
      <arrow> <attr><lang:pylon.fluid.hydraulic_fluid/> usage:</attr> %fluid-per-craft% per seconds
      <arrow> <attr>Buffer:</attr> %buffer%
  diesel_woodcutter:
    name: "Diesel Woodcutter"
    lore: |-
      <arrow> Automatic logging and consume one piece of log in output inventory to replanting
      <arrow> <attr><lang:pylon.fluid.biodiesel/> usage:</attr> %fluid-per-craft% per seconds
      <arrow> <attr>Buffer:</attr> %buffer%

