addon: "哆啦科技"

item:
  explosion_pickaxe:
    name: "爆炸镐"
    lore: |-
      <arrow> 破坏5x5x5或3x3x3的方块
      <arrow> 使用 <yellow>潜行键 <gray>+ <green>右键 <gray>切换模式
  explosion_shovel:
    name: "爆炸铲"
    lore: |-
      <arrow> 破坏5x5x5或3x3x3的方块
      <arrow> 使用 <yellow>潜行键 <gray>+ <green>右键 <gray>切换模式
  unbreakable_rune:
    name: "不可破坏符文"
    lore: |-
      <arrow> 给予物品无法破坏效果
  plan_c:
    name: "C计划"
    lore: |-
      <arrow> <red>杀死<gray>以自己为中心半径5的所有生物
      <arrow> 右键使用后<red>移除
  industrial_miner:
    name: "工业矿机"
    lore: |-
      <star> 多方块结构
      <arrow> 2x 钻石块
      <arrow> 2x 朝上的活塞
      <arrow> 1x 箱子
      <arrow> 消耗岩浆挖取矿物
      <arrow> 需要把岩浆桶放置在箱子里
      <arrow> 放置岩浆桶后右键高炉
  golden_bone_meal:
    name: "黄金骨粉"
    lore: |-
      <arrow> 使包括甘蔗在内的作物成长到完全成熟阶段
      <arrow> os: 金坷垃说是
  filter:
    name: "滤网"
    lore: |-
      <arrow> 用于滤网底座
  filter_base:
    name: "滤网底座"
    lore: |- 
      <arrow> 需要放入滤网
      <arrow> 需要放置在静态水中
      <arrow> 可产出粉尘
  multi_fluid_tank:
    name: "混合流体储罐"
    lore: |-
      <arrow> 支持储存四种液体
      <arrow> 要求放入流体储罐
      <arrow> 最大容量取决于放入储罐数量
  timing_charger:
    name: "定时充能器"
    lore: |-
      <arrow> 如果向下第二格方块类型为发射器/投掷器，则激活一次
      <arrow> 每指定tick激活一次
    waila: "定时充能器 | 现在延迟: <yellow>%delay% <white>刻"
  liselette_enchanter:
    name: "质源附魔台"
    lore: |-
      <arrow> 允许使用附魔书为pylon装备附魔
      <arrow> <attr>每秒消耗 <lang:pylon.fluid.obscyra/>:</attr> %fluid-per-craft%
      <arrow> <attr>缓冲区:</attr> %buffer%
  liselette_disenchanter:
    name: "质源祛魔台"
    lore: |-
      <arrow> 允许将附魔从装备提取到附魔书或书本
      <arrow> <attr>每秒消耗 <lang:pylon.fluid.obscyra/>:</attr> %fluid-per-craft%
      <arrow> <attr>缓冲区:</attr> %buffer%
  road_tool:
    name: "铺路工具"
    lore: |-
      <arrow> 潜行时且你脚下是空气，将自动放置方块
      <arrow> 需要背包里有方块
      <arrow> 方块将在 <yellow>%delete_delay%<gray> 秒后被移除
      <arrow> 使用 <green>右键 <gray>开启/关闭此功能
      <arrow> 使用 <yellow>Shift <gray>+ <green>右键 <gray>切换方块类型
      <arrow> 当前状态: <yellow>%enabled%
      <arrow> 方块类型: <yellow>%block%
    enabled: "<green>开"
    disabled: "<red>关"
  portable_backpack:
    name: "便携式背包"
    lore: |-
      <arrow> 可用于储存物品和液体
      <arrow> <green>右键 <gray>以打开
      <arrow> 放在地上以输入液体
      <arrow> 使用 /setbackpackname 来修改背包的名称
      <arrow> %type1%: %amount1%/%capacity%
      <arrow> %type2%: %amount2%/%capacity%
  redstone_link:
    name: "无线红石信号终端"
    lore: |-
      <arrow> 远程传输 <red>红石能量
      <arrow> <gray>最大传输半径: <green>%radius% <gray>格
      <arrow> 触发间隔: <green>%ticks% <gray>tick
      <arrow> 使用 %have-wrench% 在发射端/接收端模式间切换
      <arrow> 使用 <insn><lang:doramachines.item.linked_connector.name></insn> 来设置信道
    have_wrench: <insn><lang:rebarwrench.item.wrench.name></insn>
    dont_have_wrench: <insn>木棍</insn>
  linked_connector:
    name: "信道连接器"
    lore: |-
      <arrow> 在 <insn><lang:doramachines.item.redstone_link.name></insn> 的发射端与接收端之间建立信道
      <arrow> <green>右键 <yellow>发射端 <gray>以记录信道
      <arrow> 然后 <green>右键 <yellow>接收端 <gray>以设置信道
      <arrow> <yellow>Shift <gray>+ <green>右键 <gray>以查看同一信道上处于激活状态的发射端/接收端位置
  temp_block:
    name: "测试方块"
  hydraulic_woodcutter:
    name: "液压伐木机"
    lore: |-
      <arrow> 自动砍树并消耗一个木头以补种
      <arrow> <attr>每秒消耗 <lang:pylon.fluid.hydraulic_fluid/>:</attr> %fluid-per-craft%
      <arrow> <attr>缓冲区:</attr> %buffer%
  diesel_woodcutter:
    name: "柴油伐木机"
    lore: |-
      <arrow> 自动砍树并消耗一个储存在输出槽的木头以补种
      <arrow> <attr>每秒消耗 <lang:pylon.fluid.biodiesel/>:</attr> %fluid-per-craft%
      <arrow> <attr>缓冲区:</attr> %buffer%
  redstone_clock:
    name: "红石钟"
    lore: |-
      <arrow> 每隔指定时间发出红石信号
  void_picker:
    name: "虚空拾取者"
    lore: |-
      <arrow> 删除在白名单里或不在黑名单里的新拾取的掉落物
      <arrow> <green>右键 <gray>以打开界面
      <arrow> %mode%
      <arrow> 掉落物列表: %item%
    prefix: "<arrow> "
  slingshot:
    name: "弹弓"
    lore: |-
      <arrow> 副手放置想要发射的物品并长按 <green>右键 <gray>以使用
  ruckus_maker:
    name: "B动静制造器"
    lore: |-
      <arrow> <green>右键 <gray>以使用
      <arrow> 随机播放粒子和声音
  dagger:
    name: "匕首"
    lore: |-
      <arrow> <green>右键 <gray>以向前冲刺
      <arrow> 冲刺过程中攻击实体将后跃
      <arrow> <yellow>Shift <gray>+ <green>右键 <gray>以开关
      <arrow> 当前状态: <yellow>%enabled%
    enabled: "<green>开"
    disabled: "<red>关"
  assault_shield:
    name: "突击盾"
    lore: |-
      <arrow> <yellow>Shift <gray>+ <green>右键 <gray>以切换模式
      <arrow> 模式: <yellow>%mode%
      <arrow> <gray>%dist%
    assault: 
      name: "突击"
      lore: |-
        <green>右键 <gray>以向前冲刺
        <arrow> 将击退冲刺途中的实体
    push: 
      name: "退敌"
      lore: |-
        <green>右键 <gray>以格挡
        <arrow> 击退前方的实体
  pay_to_win_lv1:
    name: "<yellow>充钱制胜 Lv1"
    lore: |-
      <arrow> 消耗 <yellow>金锭 <gray>以增加造成的伤害
      <arrow> 每次消耗的数量: <green>%amount%<gray>
      <arrow> 每次增加的伤害: <green>%damage%
  pay_to_win_lv2:
    name: "<yellow>充钱制胜 Lv2"
    lore: |-
      <arrow> 消耗 <yellow>金锭 <gray>以增加造成的伤害
      <arrow> 每次消耗的数量: <green>%amount%<gray>
      <arrow> 每次增加的伤害: <green>%damage%
  pay_to_win_lv3:
    name: "<yellow>充钱制胜 Lv3"
    lore: |-
      <arrow> 消耗 <yellow>金锭 <gray>以增加造成的伤害
      <arrow> 每次消耗的数量: <green>%amount%<gray>
      <arrow> 每次增加的伤害: <green>%damage%
  pay_to_win_lv4:
    name: "<yellow>充钱制胜 Lv4"
    lore: |-
      <arrow> 消耗 <yellow>金锭 <gray>以增加造成的伤害
      <arrow> 每次消耗的数量: <green>%amount%<gray>
      <arrow> 每次增加的伤害: <green>%damage%

